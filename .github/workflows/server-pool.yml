#!/usr/bin/env python3
"""KalaniVPN3 security hardening installer. Applies a guarded security layer to the existing Java/Android project: - AES-256-GCM encrypted-at-rest storage backed by Android Keystore. - Secure migration of legacy plaintext server/config preferences. - HMAC-derived opaque server aliases (no raw hostnames/IPs in UI labels). - Opaque UI labels and removal of server endpoint display. - Detached P-256 ECDSA/SHA-256 signature verification for the public server pool. It does not change the active VPN engine, TUN ownership, transport selection, probe scheduling, server-selection rules, or connection lifecycle. Run from Code on the Go Terminal: python /storage/emulated/0/Download/KalaniVPN3_SECURITY_HARDENING_INSTALLER.py The installer backs up every changed file, verifies exact source markers, performs atomic replacements, and rolls back if any write verification fails. """
