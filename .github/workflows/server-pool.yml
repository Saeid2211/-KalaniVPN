name: Kalani server pool

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/server-pool.yml'
      - 'server-pool/collect.py'
      - 'server-pool/sources.txt'
      - 'server-pool/geoip_ipinfo.py'
      - 'server-pool/test_geo_quorum.py'
      - 'server-pool/apply_geoip_phase4.py'

permissions:
  contents: write

concurrency:
  group: kalani-server-pool
  cancel-in-progress: false

jobs:
  collect-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Verify required Actions secrets are configured
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          KALANI_POOL_SIGNING_KEY_B64: ${{ secrets.KALANI_POOL_SIGNING_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$IPINFO_TOKEN" ]; then
            echo "::error::Repository Actions secret IPINFO_TOKEN is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$KALANI_POOL_SIGNING_KEY_B64" ]; then
            echo "::error::Repository Actions secret KALANI_POOL_SIGNING_KEY_B64 is missing. Add the matching PEM private key, either as PEM text or Base64-encoded PEM."
            exit 1
          fi
          echo "Required Actions secrets are present. Their values will not be printed."

      - name: Apply GeoIP Phase 4 adapter to collector
        run: python3 server-pool/apply_geoip_phase4.py

      - name: Test GeoIP quorum logic
        working-directory: server-pool
        run: python3 -m unittest -v test_geo_quorum.py

      - name: Install pinned sing-box 1.14.4
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64-glibc.tar.gz'
          SHA='231e57c18378f780a08de832844a1ca9716e17a7bcf82964b350844d243c03ac'
          curl -fsSL "$URL" -o /tmp/sing-box.tar.gz
          printf '%s %s\n' "$SHA" /tmp/sing-box.tar.gz | sha256sum -c -
          mkdir -p /tmp/sing-box-extract
          tar -xzf /tmp/sing-box.tar.gz -C /tmp/sing-box-extract
          BIN="$(find /tmp/sing-box-extract -type f -name sing-box -print -quit)"
          test -n "$BIN"
          sudo install -m 0755 "$BIN" /usr/local/bin/sing-box
          sing-box version

      - name: Install pinned unbox URI converter
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/aceberg/unbox/releases/download/v1.1.2/unbox_1.1.2_linux_amd64.tar.gz'
          SHA='b4f24278dcf28913aaa09774746fc66a37f99cf90205e0b46193258b53c3a017'
          curl -fsSL "$URL" -o /tmp/unbox.tar.gz
          printf '%s %s\n' "$SHA" /tmp/unbox.tar.gz | sha256sum -c -
          mkdir -p /tmp/unbox-extract
          tar -xzf /tmp/unbox.tar.gz -C /tmp/unbox-extract
          BIN="$(find /tmp/unbox-extract -type f -name unbox -print -quit)"
          test -n "$BIN"
          sudo install -m 0755 "$BIN" /usr/local/bin/unbox
          unbox examples >/dev/null

      - name: Record the existing Pool fingerprint
        id: pool-before
        shell: bash
        run: |
          set -euo pipefail
          if [ -s server-pool/server-pool.json ]; then
            printf 'sha=%s\n' "$(git hash-object server-pool/server-pool.json)" >> "$GITHUB_OUTPUT"
          else
            printf 'sha=missing\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Collect and test public candidates
        env:
          MAX_CANDIDATES: '120'
          MAX_WORKERS: '4'
          SING_BOX_BIN: sing-box
          UNBOX_BIN: unbox
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: python3 server-pool/collect.py

      - name: Sign the verified server pool
        env:
          KALANI_POOL_SIGNING_KEY_B64: ${{ secrets.KALANI_POOL_SIGNING_KEY_B64 }}
          POOL_BEFORE_SHA: ${{ steps.pool-before.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          POOL='server-pool/server-pool.json'
          SIGNATURE='server-pool/server-pool.json.sig'
          test -s "$POOL" || { echo '::error::No server pool JSON exists to sign.'; exit 1; }

          KEY_FILE="$(mktemp)"
          PUBLIC_PEM="$(mktemp)"
          PUBLIC_DER="$(mktemp)"
          SIGNATURE_DER="$(mktemp)"
          trap 'rm -f "$KEY_FILE" "$PUBLIC_PEM" "$PUBLIC_DER" "$SIGNATURE_DER"' EXIT
          umask 077

          # Accept either a PEM private key pasted directly into the GitHub
          # Secret, or a Base64-encoded PEM. Strip only surrounding whitespace
          # from the Base64 representation; never decode a PEM block as Base64.
          SECRET_VALUE="${KALANI_POOL_SIGNING_KEY_B64%$'\r'}"
          if [[ "$SECRET_VALUE" == *"-----BEGIN "* ]]; then
            printf '%s\n' "$SECRET_VALUE" > "$KEY_FILE"
          else
            CLEAN_B64="$(printf '%s' "$SECRET_VALUE" | tr -d '[:space:]')"
            CLEAN_B64="${CLEAN_B64#base64:}"
            if [[ ! "$CLEAN_B64" =~ ^[A-Za-z0-9+/]*={0,2}$ ]]; then
              echo '::error::KALANI_POOL_SIGNING_KEY_B64 is neither PEM text nor valid standard Base64. Store the matching PEM private key directly, or store base64 of that PEM.'
              exit 1
            fi
            if ! printf '%s' "$CLEAN_B64" | base64 --decode > "$KEY_FILE"; then
              echo '::error::Could not decode KALANI_POOL_SIGNING_KEY_B64. Check that the GitHub Secret contains the full Base64 value, not the public key or a truncated value.'
              exit 1
            fi
          fi

          if [ ! -s "$KEY_FILE" ] || ! openssl pkey -in "$KEY_FILE" -check -noout >/dev/null 2>&1; then
            echo '::error::The signing secret did not contain a valid, unencrypted PEM private key.'
            exit 1
          fi
          openssl pkey -in "$KEY_FILE" -pubout -out "$PUBLIC_PEM"
          openssl pkey -in "$KEY_FILE" -pubout -outform DER -out "$PUBLIC_DER"

          ACTUAL_PUBLIC_KEY_B64="$(base64 --wrap=0 "$PUBLIC_DER")"
          EXPECTED_PUBLIC_KEY_B64='MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAExcJitVyAY8vxJPunna+368tTSD1rGPFQG4/0WtxD5UTN/50TtuqiYvDiNf0c3eBYZxP2rfPgRZn0QxN431k8oQ=='
          if [ "$ACTUAL_PUBLIC_KEY_B64" != "$EXPECTED_PUBLIC_KEY_B64" ]; then
            echo '::error::Signing key does not match the P-256 public key pinned in the Android app. No signature was published.'
            exit 1
          fi

          # Reuse a valid signature only when the collector left the Pool
          # unchanged. Never use this signing key to bless an old unsigned Pool:
          # if there is no valid signature, a fresh collector output is required.
          CURRENT_POOL_SHA="$(git hash-object "$POOL")"
          NEEDS_SIGNING=1
          EXISTING_SIGNATURE_VALID=0
          if [ -s "$SIGNATURE" ] \
            && base64 --decode "$SIGNATURE" > "$SIGNATURE_DER" 2>/dev/null \
            && openssl dgst -sha256 -verify "$PUBLIC_PEM" -signature "$SIGNATURE_DER" "$POOL" >/dev/null 2>&1; then
            EXISTING_SIGNATURE_VALID=1
          fi

          if [ "$CURRENT_POOL_SHA" = "$POOL_BEFORE_SHA" ]; then
            if [ "$EXISTING_SIGNATURE_VALID" -eq 1 ]; then
              NEEDS_SIGNING=0
              echo 'Pool JSON is unchanged and its existing signature is valid.'
            else
              echo '::error::Collector did not produce a fresh Pool. Refusing to sign an unchanged unsigned or invalid legacy Pool.'
              exit 1
            fi
          fi

          if [ "$NEEDS_SIGNING" -eq 1 ]; then
            openssl dgst -sha256 -sign "$KEY_FILE" -out "$SIGNATURE_DER" "$POOL"
            openssl dgst -sha256 -verify "$PUBLIC_PEM" -signature "$SIGNATURE_DER" "$POOL"
            base64 --wrap=0 "$SIGNATURE_DER" > "$SIGNATURE"
            test -s "$SIGNATURE"
            echo 'Verified detached P-256 ECDSA/SHA-256 signature generated.'
          fi

      - name: Publish verified pool and signature
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s server-pool/server-pool.json ] || [ ! -s server-pool/server-pool.json.sig ]; then
            echo 'Pool JSON or detached signature is missing; nothing will be published.'
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Refresh main before publishing. If another push wins the race,
          # retry on top of the new remote commit without discarding our pool.
          max_attempts=4
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Publish attempt $attempt/$max_attempts"

            git fetch origin main
            git reset --mixed origin/main
            git add server-pool/server-pool.json server-pool/server-pool.json.sig

            if git diff --cached --quiet; then
              echo 'Pool and signature did not change; no commit is needed.'
              exit 0
            fi

            git commit -m 'Update verified Kalani server pool and signature'

            if git push origin HEAD:main; then
              echo 'Verified server pool and detached signature published successfully.'
              exit 0
            fi

            echo "::warning::Push attempt $attempt failed; refreshing main before retry."
            sleep "$((attempt * 2))"
          done

          echo "::error::Could not publish the verified pool after $max_attempts attempts."
          exit 1
