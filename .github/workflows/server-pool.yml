        ' + " NODE=" + displayServerAlias(server));\n',
        "Lookup log server name"
    )

    # Protect historical server identity strings. Older versions placed the
    # canonical connection key (including credentials and endpoint) in a plain
    # SharedPreferences StringSet. New history is serialized only inside AES-GCM.
    old_history_method = ''' /** * Normalizes the existing history once when upgrading from the former * raw-JSON key format, then keeps future reads on the canonical key format. */ private LinkedHashSet<String> getCanonicalServerHistory( android.content.SharedPreferences prefs) { LinkedHashSet<String> normalized = new LinkedHashSet<>(); int historyVersion = prefs.getInt("history_key_version", 0); if (historyVersion >= 3) { normalized.addAll(prefs.getStringSet( "used_servers", java.util.Collections.emptySet())); return normalized; } // Versions 0-2 could contain servers remembered by ping-only scans. // Those entries were never proven through the full VPN tunnel, so reset // them once rather than excluding good servers indefinitely. prefs.edit() .remove("used_servers") .putInt("history_key_version", 3) .apply(); return normalized; } '''
    new_history_method = ''' /** Reads server history only from the Keystore-encrypted store. */ private LinkedHashSet<String> getCanonicalServerHistory( android.content.SharedPreferences prefs) { LinkedHashSet<String> normalized = new LinkedHashSet<>(); int historyVersion = prefs.getInt("history_key_version", 0); if (historyVersion >= 4) { String raw = KalaniSecureStore.getString( this, "kalani_server_history", "used_servers_json", "[]"); try { JSONArray array = new JSONArray(raw); for (int i = 0; i < array.length(); i++) { String value = array.optString(i, ""); if (!value.isEmpty()) normalized.add(value); } } catch (Exception invalidHistory) { KalaniSecureStore.removeString( this, "kalani_server_history", "used_servers_json"); } return normalized; } // Version 3 held canonical JSON/URI identities in a plaintext StringSet. // Migrate to encrypted storage before removing the legacy copy. if (historyVersion == 3) { java.util.Set<String> legacy = prefs.getStringSet( "used_servers", java.util.Collections.emptySet()); if (legacy != null) normalized.addAll(legacy); } JSONArray migrated = new JSONArray(); for (String value : normalized) migrated.put(value); boolean saved = KalaniSecureStore.putString( this, "kalani_server_history", "used_servers_json", migrated.toString()); prefs.edit().remove("used_servers") .putInt("history_key_version", 4).commit(); if (!saved) normalized.clear(); return normalized; } '''
    src = replace_once(src, old_history_method, new_history_method,
                       "Encrypted server history migration")

    old_history_write = ''' prefs.edit() .putStringSet("used_servers", used) .putInt("history_key_version", 3) .apply(); '''
    new_history_write = ''' JSONArray history = new JSONArray(); for (String item : used) history.put(item); boolean saved = KalaniSecureStore.putString( this, "kalani_server_history", "used_servers_json", history.toString()); prefs.edit().remove("used_servers") .putInt("history_key_version", 4).apply(); if (!saved) android.util.Log.w( "KALANI_SECURE_STORE", "Server history was not persisted because encryption failed"); '''
    src = replace_once(src, old_history_write, new_history_write,
                       "Encrypted server history write")

    # Per-server handset benchmarks are also stored encrypted. Their cache key
    # is a keyed, installation-specific alias instead of a reversible identity.
    old_metrics_read = ''' JSONObject saved = new JSONObject(getSharedPreferences( "kalani_device_metrics", MODE_PRIVATE).getString(key, "{}")); '''
    new_metrics_read = ''' JSONObject saved = new JSONObject(KalaniSecureStore.getString( this, "kalani_device_metrics", key, "{}")); '''
    src = replace_once(src, old_metrics_read, new_metrics_read,
                       "Encrypted device metrics read")

    old_metrics_write = ''' getSharedPreferences("kalani_device_metrics", MODE_PRIVATE) .edit().putString(key, saved.toString()).apply(); '''
    new_metrics_write = ''' if (!KalaniSecureStore.putString( this, "kalani_device_metrics", key, saved.toString())) { android.util.Log.w("KALANI_SECURE_STORE", "Device benchmark metadata encryption failed"); } '''
    src = replace_once(src, old_metrics_write, new_metrics_write,
                       "Encrypted device metrics write")

    old_metric_key = ''' private String deviceMetricKey(Server server) { try { String identity = canonicalServerKey(server.outbound.toString()); byte[] digest = java.security.MessageDigest.getInstance("SHA-256") .digest(identity.getBytes(java.nio.charset.StandardCharsets.UTF_8)); StringBuilder key = new StringBuilder("node_"); for (byte value : digest) key.append(String.format(Locale.US, "%02x", value & 0xff)); return key.toString(); } catch (Exception error) { return ""; } } '''
    new_metric_key = ''' private String deviceMetricKey(Server server) { if (server == null || server.outbound == null) return ""; String identity = canonicalServerKey(server.outbound.toString()); String opaque = KalaniSecureStore.opaqueId(this, identity); return opaque.startsWith("NODE-") && !"NODE-LOCAL".equals(opaque) ? "metric_" + opaque : ""; } '''
    src = replace_once(src, old_metric_key, new_metric_key,
                       "HMAC device metric identity")

    old_exit_key = ''' private String verifiedExitStorageKey(Server server) { if (server == null || server.outbound == null) return ""; try { // Keep the existing metadata-cache key format to preserve cached // verified-exit records created by previous app versions. byte[] input = server.outbound.toString() .getBytes(java.nio.charset.StandardCharsets.UTF_8); byte[] digest = java.security.MessageDigest .getInstance("SHA-256").digest(input); StringBuilder key = new StringBuilder("server_"); for (byte b : digest) { key.append(String.format(Locale.US, "%02x", b & 0xff)); } return key.toString(); } catch (Exception ignored) { return ""; } } '''
    new_exit_key = ''' private String verifiedExitStorageKey(Server server) { if (server == null || server.outbound == null) return ""; String identity = canonicalServerKey(server.outbound.toString()); String opaque = KalaniSecureStore.opaqueId(this, identity); return opaque.startsWith("NODE-") && !"NODE-LOCAL".equals(opaque) ? "exit_" + opaque : ""; } '''
    src = replace_once(src, old_exit_key, new_exit_key,
                       "HMAC verified-exit metadata identity")

    legacy_cleanup = ''' private void clearLegacyServerMetadata() { android.content.SharedPreferences state = getSharedPreferences( "kalani_engine_state", MODE_PRIVATE); if (state.getBoolean("security_plain_metadata_purged_v1", false)) return; // These two legacy caches stored per-node metadata in clear text. Their // values are cheap to recompute, so remove them rather than preserve a // linkable server identity outside the encrypted store. getSharedPreferences("kalani_device_metrics", MODE_PRIVATE) .edit().clear().commit(); getSharedPreferences("kalani_verified_exit_metadata", MODE_PRIVATE) .edit().clear().commit(); // Migrate the current recent-route identity into Keystore-backed storage, // then erase legacy display labels and endpoint addresses. KalaniSecureStore.getString( this, "kalani_recent_connection", "server_key", ""); KalaniSecureStore.getString( this, "kalani_recent_connection", "country", ""); KalaniSecureStore.getString( this, "kalani_recent_connection", "flag", "🌐"); KalaniSecureStore.removeString( this, "kalani_recent_connection", "server_name"); KalaniSecureStore.removeString( this, "kalani_recent_connection", "server_ip"); state.edit().putBoolean("security_plain_metadata_purged_v1", true).commit(); android.util.Log.i("KALANI_SECURE_STORE", "Legacy plaintext node metadata purged"); } '''
    src = replace_once(
        src,
        ''' private void loadServers(boolean manualRefresh) { clearPreSingBoxServerSnapshots(); ''',
        ''' private void loadServers(boolean manualRefresh) { clearPreSingBoxServerSnapshots(); clearLegacyServerMetadata(); ''',
        "Legacy metadata cleanup call"
    )
    alias_anchor = ''' private void clearPreSingBoxServerSnapshots() { '''
    src = replace_once(src, alias_anchor, legacy_cleanup + "\n" + alias_anchor,
                       "Legacy metadata cleanup helper")

    return src


