def main() -> int:
    print("========== KALANIVPN3 SECURITY HARDENING ==========")
    print("Project:", ROOT)
    if not ROOT.is_dir():
        print("ERROR: Project folder not found; no files changed.")
        return 2

    files = {
        "app/src/main/java/com/example/MainActivity.java": patch_main,
        "app/src/main/java/com/example/KalaniServerPrefetchWorker.java": patch_worker,
        "app/src/main/java/com/example/KalaniServerPoolClient.java": patch_pool_client,
        "app/src/main/java/com/example/KalaniVpnService.java": patch_service,
    }
    targets: dict[Path, bytes] = {}
    originals: dict[Path, bytes] = {}

    secure_path = JAVA / "KalaniSecureStore.java"
    signature_path = JAVA / "KalaniPoolSignature.java"
    if secure_path.exists() or signature_path.exists():
        print("ERROR: Security classes already exist. Refusing duplicate installation.")
        return 3

    try:
        for relative, transformer in files.items():
            path = ROOT / relative
            if not path.is_file():
                raise PatchError(f"Required file missing: {relative}")
            data = path.read_bytes()
            source = data.decode("utf-8")
            transformed = transformer(source)
            if transformed == source:
                raise PatchError(f"No changes detected for {relative}")
            originals[path] = data
            targets[path] = transformed.encode("utf-8")

        store_source = SECURE_STORE
        sig_source = POOL_SIGNATURE
        if PUBLIC_KEY_B64 not in sig_source or len(PUBLIC_KEY_B64) < 80:
            raise PatchError("Pinned Pool public key was not embedded")
        targets[secure_path] = store_source.encode("utf-8")
        targets[signature_path] = sig_source.encode("utf-8")

        # All transformations and marker checks have succeeded. Back up every file.
        stamp = datetime.now().strftime("%Y%m%d_%H%M%S")
        backups: list[tuple[Path, Path | None]] = []
        for target in targets:
            if target.exists():
                backup = target.with_name(target.name + ".before_security_" + stamp)
                shutil.copy2(target, backup)
                backups.append((target, backup))
            else:
                backups.append((target, None))

        written: list[Path] = []
        try:
            for path, data in targets.items():
                path.parent.mkdir(parents=True, exist_ok=True)
                write_atomic(path, data)
                if path.read_bytes() != data:
                    raise PatchError(f"Read-back verification failed: {path}")
                written.append(path)
        except Exception:
            # Restore existing files and remove newly-created files on any failure.
            for path, backup in reversed(backups):
                try:
                    if backup is None:
                        if path.exists(): path.unlink()
                    else:
                        shutil.copy2(backup, path)
                except Exception:
                    pass
            raise

        print("PATCH RESULT: SUCCESS")
        print("Added: KalaniSecureStore.java (Android Keystore AES-256-GCM + HMAC aliases)")
        print("Added: KalaniPoolSignature.java (pinned P-256 ECDSA/SHA-256 verification)")
        print("Encrypted at rest: signed Pool, active/standby pools, recovery config,")
        print(" recent route, server history, device metrics, exit metadata")
        print("Legacy plaintext endpoint/history/metric caches: migration cleanup enabled")
        print("UI: opaque HMAC-derived node aliases; raw server endpoint/name hidden")
        print("Transport/TUN/lifecycle: unchanged")
        print("Backups:")
        for target, backup in backups:
            if backup is not None: print(" ", backup)
        print("SHA256:")
        for path, data in targets.items():
            print(" ", path.relative_to(ROOT), sha256(data))
        print("IMPORTANT: The app will reject the Pool until server-pool.json.sig is published.")
        print("Add GitHub Actions secret KALANI_POOL_SIGNING_KEY_B64, then run the Pool workflow.")
        return 0

    except Exception as error:
        print("ERROR:", str(error))
        print("NO FILES WERE CHANGED (or all changed files were rolled back).")
        return 4


if __name__ == "__main__":
    raise SystemExit(main())
