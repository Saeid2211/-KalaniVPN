    old_fetch = ''' String raw = downloadDocument(); Snapshot snapshot = validateDocument(raw, false); SharedPreferences prefs = context.getApplicationContext() .getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE); boolean saved = prefs.edit() .putString(PREFS_KEY, raw) .commit(); if (!saved) { Log.w(TAG, "Validated Pool could not be written to local cache"); } '''
    new_fetch = ''' String raw = downloadDocument(); String signature = downloadSignature(); if (!KalaniPoolSignature.verify(raw, signature)) { throw new Exception("Server Pool digital signature verification failed"); } Snapshot snapshot = validateDocument(raw, false); JSONObject envelope = new JSONObject() .put("document", raw) .put("signature", signature); boolean saved = KalaniSecureStore.putString( context, PREFS_NAME, PREFS_KEY, envelope.toString()); if (!saved) { Log.w(TAG, "Signed Pool validated but encrypted local cache write failed"); } else { // Remove the previous raw, unsigned Pool cache after the signed // envelope is safely committed under the Keystore-backed key. context.getApplicationContext().getSharedPreferences( PREFS_NAME, Context.MODE_PRIVATE) .edit().remove(LEGACY_PREFS_KEY).commit(); } '''
    src = replace_once(src, old_fetch, new_fetch, "Pool fresh-fetch storage")

    old_cache = ''' SharedPreferences prefs = context.getApplicationContext() .getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE); String raw = prefs.getString(PREFS_KEY, null); if (raw == null || raw.trim().isEmpty()) { throw new Exception("Server Pool cache is empty"); } return validateDocument(raw, true); '''
    new_cache = ''' context.getApplicationContext().getSharedPreferences( PREFS_NAME, Context.MODE_PRIVATE) .edit().remove(LEGACY_PREFS_KEY).commit(); String envelopeRaw = KalaniSecureStore.getString( context, PREFS_NAME, PREFS_KEY, null); if (envelopeRaw == null || envelopeRaw.trim().isEmpty()) { throw new Exception("No signed encrypted Server Pool cache is available"); } JSONObject envelope = new JSONObject(envelopeRaw); String raw = envelope.optString("document", ""); String signature = envelope.optString("signature", ""); if (!KalaniPoolSignature.verify(raw, signature)) { KalaniSecureStore.removeString(context, PREFS_NAME, PREFS_KEY); throw new Exception("Cached Server Pool digital signature is invalid"); } return validateDocument(raw, true); '''
