class PatchError(Exception):
    pass


def sha256(data: bytes) -> str:
    return hashlib.sha256(data).hexdigest()


def replace_once(src: str, old: str, new: str, label: str) -> str:
    count = src.count(old)
    if count != 1:
        raise PatchError(f"{label}: expected exactly one matching block, found {count}")
    return src.replace(old, new, 1)


def replace_count(src: str, old: str, new: str, expected: int, label: str) -> str:
    count = src.count(old)
    if count != expected:
        raise PatchError(f"{label}: expected {expected} matching blocks, found {count}")
    return src.replace(old, new)


def write_atomic(path: Path, data: bytes) -> None:
    tmp = path.with_name(path.name + ".kalani_security.tmp")
    try:
        with open(tmp, "wb") as f:
            f.write(data)
            f.flush()
            os.fsync(f.fileno())
        try:
            os.chmod(tmp, stat.S_IMODE(path.stat().st_mode))
        except OSError:
            pass
        os.replace(tmp, path)
    finally:
        try:
            if tmp.exists():
                tmp.unlink()
        except OSError:
            pass


SECURE_STORE = r'''package com.example.kalanivpn; import android.content.Context; import android.content.SharedPreferences; import android.security.keystore.KeyGenParameterSpec; import android.security.keystore.KeyProperties; import android.util.Base64; import java.io.ByteArrayOutputStream; import java.nio.ByteBuffer; import java.nio.charset.StandardCharsets; import java.security.Key; import java.security.KeyStore; import java.util.Locale; import javax.crypto.Cipher; import javax.crypto.KeyGenerator; import javax.crypto.Mac; import javax.crypto.SecretKey; import javax.crypto.spec.GCMParameterSpec; /** * App-private encrypted storage for server credentials and sing-box configs. * AES-256-GCM keys are generated and kept inside Android Keystore. * Values are authenticated against their logical namespace and key name. */ public final class KalaniSecureStore { private static final String TAG = "KALANI_SECURE_STORE"; private static final String KEYSTORE = "AndroidKeyStore"; private static final String STORE_PREFS = "kalani_secure_store_v1"; private static final String AES_ALIAS = "kalani_secure_aes_gcm_v1"; private static final String HMAC_ALIAS = "kalani_node_alias_hmac_v1"; private static final Object LOCK = new Object(); private static final int IV_BYTES = 12; private static final int TAG_BITS = 128; private KalaniSecureStore() { } private static String storageKey(String namespace, String key) { return namespace + "::" + key; } private static byte[] aad(String namespace, String key) { return ("KalaniVPN\u0000" + namespace + "\u0000" + key) .getBytes(StandardCharsets.UTF_8); } public static String getString( Context context, String namespace, String key, String defaultValue) { if (context == null || namespace == null || key == null) return defaultValue; Context app = context.getApplicationContext(); synchronized (LOCK) { SharedPreferences secure = app.getSharedPreferences(STORE_PREFS, Context.MODE_PRIVATE); String encoded = secure.getString(storageKey(namespace, key), null); if (encoded != null) { try { String value = decrypt(app, namespace, key, encoded); app.getSharedPreferences(namespace, Context.MODE_PRIVATE) .edit().remove(key).commit(); return value; } catch (Exception invalidCiphertext) { // Authentication/key loss invalidates this cache entry. Never // fall back to a stale plaintext copy after ciphertext exists. secure.edit().remove(storageKey(namespace, key)).commit(); app.getSharedPreferences(namespace, Context.MODE_PRIVATE) .edit().remove(key).commit(); android.util.Log.w(TAG, "Encrypted cache entry rejected; fresh data is required"); return defaultValue; } } // One-time migration: encrypt legacy values before deleting plaintext. SharedPreferences legacy = app.getSharedPreferences(namespace, Context.MODE_PRIVATE); String old = legacy.getString(key, null); if (old == null) return defaultValue; if (!putEncryptedLocked(app, namespace, key, old)) { // Do not keep sensitive legacy values in clear text when the // device Keystore cannot encrypt them. Discard this cache entry. legacy.edit().remove(key).commit(); return defaultValue; } legacy.edit().remove(key).commit(); return old; } } public static boolean putString( Context context, String namespace, String key, String value) { if (context == null || namespace == null || key == null || value == null) return false; Context app = context.getApplicationContext(); synchronized (LOCK) { if (!putEncryptedLocked(app, namespace, key, value)) { app.getSharedPreferences(namespace, Context.MODE_PRIVATE) .edit().remove(key).commit(); return false; } // Remove an older plaintext copy only after ciphertext is committed. app.getSharedPreferences(namespace, Context.MODE_PRIVATE) .edit().remove(key).commit(); return true; } } public static void removeString(Context context, String namespace, String key) { if (context == null || namespace == null || key == null) return; Context app = context.getApplicationContext(); synchronized (LOCK) { app.getSharedPreferences(STORE_PREFS, Context.MODE_PRIVATE) .edit().remove(storageKey(namespace, key)).commit(); app.getSharedPreferences(namespace, Context.MODE_PRIVATE) .edit().remove(key).commit(); } } private static boolean putEncryptedLocked( Context context, String namespace, String key, String value) { try { Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding"); cipher.init(Cipher.ENCRYPT_MODE, getAesKey()); cipher.updateAAD(aad(namespace, key)); byte[] encrypted = cipher.doFinal(value.getBytes(StandardCharsets.UTF_8)); byte[] iv = cipher.getIV(); if (iv == null || iv.length != IV_BYTES) return false; ByteArrayOutputStream out = new ByteArrayOutputStream(2 + iv.length + encrypted.length); out.write(1); // payload format version out.write(iv.length); out.write(iv); out.write(encrypted); String encoded = Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP); return context.getSharedPreferences(STORE_PREFS, Context.MODE_PRIVATE) .edit().putString(storageKey(namespace, key), encoded).commit(); } catch (Exception error) { android.util.Log.e(TAG, "Could not encrypt an app-private cache value"); return false; } } private static String decrypt( Context context, String namespace, String key, String encoded) throws Exception { byte[] payload = Base64.decode(encoded, Base64.NO_WRAP); if (payload.length < 2 + IV_BYTES + 16 || payload[0] != 1) { throw new IllegalArgumentException("Invalid encrypted cache format"); } int ivLength = payload[1] & 0xff; if (ivLength != IV_BYTES || payload.length <= 2 + ivLength + 15) { throw new IllegalArgumentException("Invalid AES-GCM payload"); } byte[] iv = new byte[ivLength]; System.arraycopy(payload, 2, iv, 0, ivLength); byte[] encrypted = new byte[payload.length - 2 - ivLength]; System.arraycopy(payload, 2 + ivLength, encrypted, 0, encrypted.length); Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding"); cipher.init(Cipher.DECRYPT_MODE, getAesKey(), new GCMParameterSpec(TAG_BITS, iv)); cipher.updateAAD(aad(namespace, key)); return new String(cipher.doFinal(encrypted), StandardCharsets.UTF_8); } private static SecretKey getAesKey() throws Exception { KeyStore store = KeyStore.getInstance(KEYSTORE); store.load(null); Key existing = store.getKey(AES_ALIAS, null); if (existing instanceof SecretKey) return (SecretKey) existing; KeyGenerator generator = KeyGenerator.getInstance( KeyProperties.KEY_ALGORITHM_AES, KEYSTORE); KeyGenParameterSpec spec = new KeyGenParameterSpec.Builder( AES_ALIAS, KeyProperties.PURPOSE_ENCRYPT | KeyProperties.PURPOSE_DECRYPT) .setBlockModes(KeyProperties.BLOCK_MODE_GCM) .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE) .setKeySize(256) .setRandomizedEncryptionRequired(true) .build(); generator.init(spec); return generator.generateKey(); } /** Stable only for this installation; reveals no host, address or credential. */ public static String opaqueId(Context context, String seed) { if (context == null || seed == null) return "NODE-UNKNOWN"; try { synchronized (LOCK) { KeyStore store = KeyStore.getInstance(KEYSTORE); store.load(null); Key existing = store.getKey(HMAC_ALIAS, null); SecretKey key; if (existing instanceof SecretKey) { key = (SecretKey) existing; } else { KeyGenerator generator = KeyGenerator.getInstance( KeyProperties.KEY_ALGORITHM_HMAC_SHA256, KEYSTORE); KeyGenParameterSpec spec = new KeyGenParameterSpec.Builder( HMAC_ALIAS, KeyProperties.PURPOSE_SIGN | KeyProperties.PURPOSE_VERIFY) .setDigests(KeyProperties.DIGEST_SHA256) .setKeySize(256) .build(); generator.init(spec); key = generator.generateKey(); } Mac mac = Mac.getInstance("HmacSHA256"); mac.init(key); byte[] digest = mac.doFinal(seed.getBytes(StandardCharsets.UTF_8)); StringBuilder out = new StringBuilder("NODE-"); for (int i = 0; i < 12; i++) { out.append(String.format(Locale.US, "%02X", digest[i] & 0xff)); } return out.toString(); } } catch (Exception error) { return "NODE-LOCAL"; } } } '''

